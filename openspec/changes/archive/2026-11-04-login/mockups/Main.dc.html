<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#3c3fc4}a:hover{color:#4b4fe0}
.krow:hover{background:#f4f5fa}
.krow:focus-visible{outline:2px solid #4b4fe0;outline-offset:-2px}
.outbtn:hover{background:#f4f5fa}
.outbtn:focus-visible,.mainbtn:focus-visible,input:focus-visible{outline:2px solid #4b4fe0;outline-offset:2px}
.mainbtn:hover{background:#3c3fc4 !important}
.strip::-webkit-scrollbar{display:none}
input::placeholder{color:#5d6077}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 760px; overflow: hidden; background: linear-gradient(180deg, #eceef5 0%, #e4e6f7 18%, #ebe4f5 36%, #e1ebf4 56%, #e8e6f8 76%, #eceef5 100%); color: #16182b; font-family: 'Geologica', system-ui, sans-serif; font-size: 16px; line-height: 1.5">
  <header style="max-width: 768px; margin: 0 auto; height: 80px; padding: 0 20px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <a href="Main.dc.html" style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; line-height: 1; color: #16182b; text-decoration: none"><span aria-hidden="true" style="width: 22px; height: 22px; background: #4b4fe0"></span>Личная CRM</a>
  </header>
  <main style="max-width: 768px; margin: 0 auto; padding: 32px 20px 64px">
    <h1 style="margin: 0 0 32px; font-size: 48px; line-height: 1.05; letter-spacing: -0.04em; font-weight: 500">Вход в Личную CRM</h1>
    <form novalidate onSubmit="{{onSubmit}}" style="background: #ffffff; padding: 32px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="login-email" style="font-size: 14px; font-weight: 500; line-height: 1">Почта</label>
        <input id="login-email" type="email" name="email" autocomplete="email" value="{{email}}" onChange="{{onEmail}}" placeholder="anna@example.com" aria-invalid="{{isInvalid}}" aria-describedby="login-email-error" style="height: 48px; box-sizing: border-box; border: 1px solid {{inputBorder}}; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #16182b">
        <sc-if value="{{isInvalid}}" hint-placeholder-val="{{false}}">
          <p id="login-email-error" role="alert" style="margin: 0; font-size: 14px; color: #c0233f">Проверьте адрес почты</p>
        </sc-if>
      </div>
      <button type="submit" class="mainbtn" style="position: relative; align-self: flex-start; height: 48px; padding: 0 20px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; background: #4b4fe0; color: #ffffff; border: 0; font-family: inherit; font-size: 16px; font-weight: 500">Получить ссылку<span aria-hidden="true" style="position: absolute; top:-9px;left:-5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
          <span aria-hidden="true" style="position: absolute; top:-9px;right:-5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
          <span aria-hidden="true" style="position: absolute; bottom:-9px;left:-5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
          <span aria-hidden="true" style="position: absolute; bottom:-9px;right:-5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span></button>
      <div role="status" aria-live="polite">
        <sc-if value="{{isSent}}" hint-placeholder-val="{{false}}">
          <p style="margin: 0; padding: 12px 14px; background: #eceef9; font-size: 14px; color: #16182b; overflow-wrap: anywhere">Ссылка для входа отправлена на <b style="font-weight: 600">{{sentTo}}</b></p>
        </sc-if>
        <sc-if value="{{isFormError}}" hint-placeholder-val="{{false}}">
          <p role="alert" style="margin: 0; padding: 12px 14px; background: #fdecef; font-size: 14px; color: #a11d35">{{formError}}</p>
        </sc-if>
      </div>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startState":{"editor":"enum","options":["Пусто","Проверьте адрес","Отправлено","Слишком часто","Не удалось отправить"],"default":"Пусто"},"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const start = this.props.startState ?? 'Пусто';
    const map = { 'Пусто': 'idle', 'Проверьте адрес': 'invalid', 'Отправлено': 'sent', 'Слишком часто': 'rate', 'Не удалось отправить': 'fail' };
    const status = s.status ?? map[start] ?? 'idle';
    const email = s.email ?? (start === 'Проверьте адрес' ? 'anna@' : start === 'Пусто' ? '' : 'anna@example.com');
    const sentTo = s.sentTo ?? 'anna@example.com';
    const texts = { rate: 'Слишком часто, попробуйте через несколько минут', fail: 'Не удалось отправить письмо. Попробуйте ещё раз.' };
    const submit = () => {
      const v = (email || '').trim().toLowerCase();
      if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) this.setState({ status: 'sent', sentTo: v, email });
      else this.setState({ status: 'invalid', email });
    };
    return {
      email,
      sentTo,
      isInvalid: status === 'invalid',
      isSent: status === 'sent',
      isFormError: status === 'rate' || status === 'fail',
      formError: texts[status] || '',
      inputBorder: status === 'invalid' ? '#c0233f' : '#d4d6ef',
      onEmail: (event) => this.setState({ email: event.target.value }),
      onSubmit: (event) => { event.preventDefault(); submit(); }
    };
  }
}
</script>
</body>
</html>
