<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Страница «Группы» — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#3c3fc4}a:hover{color:#4b4fe0}
input::placeholder{color:#5d6077}
button{cursor:pointer}
.ghost:hover{background:#eceef5}
.ghost:focus-visible{outline:2px solid #4b4fe0;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; min-height: 900px; overflow: hidden; background: linear-gradient(180deg, #eceef5 0%, #e4e6f7 18%, #ebe4f5 36%, #e1ebf4 56%, #e8e6f8 76%, #eceef5 100%); color: #16182b; font-family: 'Geologica', system-ui, sans-serif; font-size: 16px; line-height: 1.5">
  <header style="max-width: 768px; margin: 0 auto; height: 80px; padding: 0 20px; box-sizing: border-box; display: flex; align-items: center">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; line-height: 1; color: #16182b; text-decoration: none"><span aria-hidden="true" style="width: 22px; height: 22px; background: #4b4fe0"></span>Личная CRM</a>
  </header>

  <main style="max-width: 768px; margin: 0 auto; padding: 32px 20px 64px; box-sizing: border-box">
    <a href="Main.dc.html" style="margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #3c3fc4; text-decoration: none">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      Все контакты
    </a>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 32px">
      <h1 style="margin: 0; font-size: 48px; line-height: 1; letter-spacing: -0.045em; font-weight: 500">Группы</h1>
      <button type="button" onClick="{{openCreate}}" style="position: relative; height: 48px; padding: 0 20px 0 16px; display: inline-flex; align-items: center; gap: 8px; background: #4b4fe0; color: #ffffff; border: 0; font-family: inherit; font-size: 16px; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        Создать группу
        <span aria-hidden="true" style="position: absolute; top: -9px; left: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
        <span aria-hidden="true" style="position: absolute; top: -9px; right: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
        <span aria-hidden="true" style="position: absolute; bottom: -9px; left: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
        <span aria-hidden="true" style="position: absolute; bottom: -9px; right: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
      </button>
    </div>

    <div style="background: #ffffff">
      <sc-if value="{{noRows}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; padding: 40px 24px; text-align: center; font-size: 14px; color: #5d6077">Групп пока нет. Нажмите «Создать группу».</p>
      </sc-if>
      <ul style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{rows}}" as="g" hint-placeholder-count="5">
          <li style="border-top: {{g.topBorder}}; min-height: 64px; box-sizing: border-box; padding: 12px 20px; display: flex; align-items: center; gap: 12px">
            <p style="flex: 1; min-width: 0; margin: 0; display: flex; align-items: baseline; gap: 8px">
              <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.name}}</span>
              <span style="flex-shrink: 0; font-size: 14px; font-weight: 300; color: #5d6077">· {{g.countText}}</span>
            </p>
            <button type="button" class="ghost" onClick="{{g.rename}}" aria-label="{{g.renameLabel}}" style="flex-shrink: 0; height: 40px; padding: 0 16px 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #d4d6ef; background: #ffffff; color: #16182b; font-family: inherit; font-size: 14px; font-weight: 500">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg>
              Переименовать
            </button>
            <button type="button" class="ghost" onClick="{{g.del}}" aria-label="{{g.delLabel}}" style="flex-shrink: 0; height: 40px; padding: 0 16px 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #d4d6ef; background: #ffffff; color: #d12c4a; font-family: inherit; font-size: 14px; font-weight: 500">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>
              Удалить
            </button>
          </li>
        </sc-for>
      </ul>
    </div>
  </main>

  <sc-if value="{{dialogOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 20; background: rgba(22, 24, 43, 0.2); display: flex; justify-content: center; align-items: flex-start; padding: 120px 16px 0; box-sizing: border-box">
      <div role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc" style="position: relative; width: 100%; max-width: 448px; box-sizing: border-box; background: #ffffff; padding: 24px; box-shadow: 0 24px 60px rgba(40, 44, 110, 0.1); display: flex; flex-direction: column; gap: 16px">
        <sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{closeDialog}}" aria-label="Закрыть" style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #5d6077">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </sc-if>
        <div style="display: flex; flex-direction: column; gap: 8px; padding-right: 24px">
          <h2 id="dlg-title" style="margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 500">{{dlgTitle}}</h2>
          <p id="dlg-desc" style="margin: 0; font-size: 14px; color: #5d6077">{{dlgDesc}}</p>
        </div>
        <sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="group-name" style="font-size: 14px; font-weight: 500; line-height: 1">Название</label>
            <input id="group-name" value="{{draft}}" onChange="{{onDraft}}" autocomplete="off" aria-invalid="{{hasError}}" placeholder="Например, Работа" style="height: 40px; box-sizing: border-box; border: 1px solid {{fieldBorder}}; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 14px; color: #16182b">
            <sc-if value="{{hasError}}" hint-placeholder-val="{{false}}">
              <p role="alert" style="margin: 0; font-size: 14px; color: #c0233f">{{error}}</p>
            </sc-if>
          </div>
        </sc-if>
        <div style="display: flex; justify-content: flex-end; gap: 8px">
          <button type="button" onClick="{{closeDialog}}" style="height: 40px; padding: 0 16px; box-sizing: border-box; border: 1px solid #d4d6ef; background: #ffffff; color: #16182b; font-family: inherit; font-size: 14px; font-weight: 500">Отмена</button>
          <sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{save}}" style="height: 40px; padding: 0 16px; box-sizing: border-box; border: 0; background: #4b4fe0; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 500">Сохранить</button>
          </sc-if>
          <sc-if value="{{isDelete}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{confirmDelete}}" style="height: 40px; padding: 0 16px; box-sizing: border-box; border: 0; background: #fbe3e8; color: #a8203a; font-family: inherit; font-size: 14px; font-weight: 500">Удалить</button>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

  <div role="status" aria-live="polite">
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; right: 24px; bottom: 24px; z-index: 30; min-width: 320px; box-sizing: border-box; padding: 14px 16px; display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #e3e5ef; box-shadow: 0 24px 60px rgba(40, 44, 110, 0.1); font-size: 14px; color: #16182b">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3c3fc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
        <span style="flex: 1">{{toastText}}</span>
        <button type="button" onClick="{{undo}}" style="height: 32px; padding: 0 10px; border: 0; background: transparent; color: #3c3fc4; font-family: inherit; font-size: 14px; font-weight: 500">Отменить</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startState":{"editor":"enum","options":["Нет","Создать","Создать: ошибка","Переименовать","Удалить","Удалил — Отменить"],"default":"Нет"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    clearTimeout(this.toastTimer);
  }

  renderVals() {
    const DEFAULT = [{ name: 'Аналитики', count: 3 }, { name: 'Друзья', count: 6 }, { name: 'Знакомые', count: 2 }, { name: 'Семья', count: 2 }, { name: 'Теннис', count: 4 }];
    const PRESETS = {
      'Нет': {},
      'Создать': { dialog: 'create', draft: '' },
      'Создать: ошибка': { dialog: 'create', draft: 'семья', error: 'Такая группа уже есть' },
      'Переименовать': { dialog: 'rename', target: 'Знакомые', draft: 'Знакомые' },
      'Удалить': { dialog: 'delete', target: 'Теннис' },
      'Удалил — Отменить': { groups: DEFAULT.filter((g) => g.name !== 'Теннис'), toast: { name: 'Теннис', count: 4 } }
    };
    const P = PRESETS[this.props.startState] || {};
    const s = this.state || {};
    const groups = s.groups !== undefined ? s.groups : (P.groups || DEFAULT);
    const dialog = s.dialog !== undefined ? s.dialog : (P.dialog || null);
    const draft = s.draft !== undefined ? s.draft : (P.draft || '');
    const error = s.error !== undefined ? s.error : (P.error || '');
    const target = s.target !== undefined ? s.target : (P.target || '');
    const toast = s.toast !== undefined ? s.toast : (P.toast || null);

    const plural = (n) => (new Intl.PluralRules('ru').select(n) === 'few' ? 'человека' : 'человек');
    const norm = (t) => t.trim().toLocaleLowerCase('ru').replace(/ё/g, 'е');
    const sortGroups = (list) => list.slice().sort((a, b) => a.name.localeCompare(b.name, 'ru'));
    const validate = (text, ownName) => {
      const t = text.trim();
      if (!t) return 'Укажите название';
      if (t.length > 50) return 'Название слишком длинное — до 50 символов';
      if (groups.some((g) => g.name !== ownName && norm(g.name) === norm(t))) return 'Такая группа уже есть';
      return '';
    };
    const save = () => {
      const err = validate(draft, dialog === 'rename' ? target : null);
      if (err) { this.setState({ error: err }); return; }
      const t = draft.trim();
      const next = dialog === 'create' ? groups.concat([{ name: t, count: 0 }]) : groups.map((g) => (g.name === target ? { name: t, count: g.count } : g));
      this.setState({ groups: sortGroups(next), dialog: null, error: '' });
    };
    const confirmDelete = () => {
      const g = groups.find((x) => x.name === target);
      clearTimeout(this.toastTimer);
      this.setState({ groups: groups.filter((x) => x.name !== target), dialog: null, toast: { name: g.name, count: g.count } });
      this.toastTimer = setTimeout(() => this.setState({ toast: null }), 10000);
    };
    const undo = () => {
      clearTimeout(this.toastTimer);
      this.setState({ groups: sortGroups(groups.concat([{ name: toast.name, count: toast.count }])), toast: null });
    };

    const targetGroup = groups.find((g) => g.name === target) || { name: target, count: 0 };
    const isForm = dialog === 'create' || dialog === 'rename';
    return {
      rows: groups.map((g, i) => ({
        name: g.name,
        countText: g.count + ' ' + plural(g.count),
        topBorder: i ? '1px solid #e3e5ef' : '0',
        rename: () => this.setState({ dialog: 'rename', target: g.name, draft: g.name, error: '' }),
        renameLabel: 'Переименовать группу ' + g.name,
        del: () => this.setState({ dialog: 'delete', target: g.name, error: '' }),
        delLabel: 'Удалить группу ' + g.name
      })),
      noRows: groups.length === 0,
      openCreate: () => this.setState({ dialog: 'create', draft: '', error: '' }),
      dialogOpen: dialog !== null,
      isForm,
      isDelete: dialog === 'delete',
      closeDialog: () => this.setState({ dialog: null, error: '' }),
      dlgTitle: dialog === 'create' ? 'Новая группа' : dialog === 'rename' ? 'Переименовать группу' : 'Удалить группу «' + targetGroup.name + '»?',
      dlgDesc: dialog === 'create' ? 'Название — до 50 символов.' : dialog === 'rename' ? 'Люди в группе останутся прежними.' : 'В ней ' + targetGroup.count + ' ' + plural(targetGroup.count) + '. Они останутся в контактах, просто без этой группы. Отменить удаление можно в течение 10 секунд.',
      draft,
      onDraft: (event) => this.setState({ draft: event.target.value, error: '' }),
      error,
      hasError: error !== '',
      fieldBorder: error ? '#c0233f' : '#d4d6ef',
      save,
      confirmDelete,
      hasToast: toast !== null,
      toastText: toast ? 'Группа «' + toast.name + '» удалена' : '',
      undo
    };
  }
}
</script>
</body>
</html>
