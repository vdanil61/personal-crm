<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#3c3fc4}a:hover{color:#4b4fe0}
.krow:hover{background:#f4f5fa}
.krow:focus-visible{outline:2px solid #4b4fe0;outline-offset:-2px}
.markbtn:hover{background:#eceef5}
.chip[aria-pressed="false"]:hover{background:#eceef5 !important}
.chip[aria-pressed="true"]:hover{background:#3c3fc4 !important}
.chip:focus-visible,.glabel:focus-visible{outline:2px solid #4b4fe0;outline-offset:2px}
.glabel:hover{background-color:#c9cdf6 !important}
input::placeholder{color:#5d6077}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 1700px; overflow: hidden; background: linear-gradient(180deg, #eceef5 0%, #e4e6f7 18%, #ebe4f5 36%, #e1ebf4 56%, #e8e6f8 76%, #eceef5 100%); color: #16182b; font-family: 'Geologica', system-ui, sans-serif; font-size: 16px; line-height: 1.5">
  <header style="max-width: 768px; margin: 0 auto; height: 80px; padding: 0 20px; box-sizing: border-box; display: flex; align-items: center">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; line-height: 1; color: #16182b; text-decoration: none"><span aria-hidden="true" style="width: 22px; height: 22px; background: #4b4fe0"></span>Личная CRM</a>
  </header>

  <main style="max-width: 768px; margin: 0 auto; padding: 32px 20px 64px; box-sizing: border-box">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 32px">
      <h1 style="margin: 0; font-size: 48px; line-height: 1; letter-spacing: -0.045em; font-weight: 500">Контакты</h1>
      <div style="display: flex; align-items: center; gap: 12px">
        <a href="Groups.dc.html" style="height: 48px; padding: 0 20px 0 16px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #d4d6ef; background: #ffffff; color: #16182b; font-size: 16px; font-weight: 500; text-decoration: none">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3c3fc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5" fill="#3c3fc4"></circle></svg>
          Группы
        </a>
        <button type="button" style="position: relative; height: 48px; padding: 0 20px 0 16px; display: inline-flex; align-items: center; gap: 8px; background: #4b4fe0; color: #ffffff; border: 0; font-family: inherit; font-size: 16px; font-weight: 500">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
          Добавить контакт
          <span aria-hidden="true" style="position: absolute; top: -9px; left: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
          <span aria-hidden="true" style="position: absolute; top: -9px; right: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
          <span aria-hidden="true" style="position: absolute; bottom: -9px; left: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
          <span aria-hidden="true" style="position: absolute; bottom: -9px; right: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
        </button>
      </div>
    </div>

    <div role="group" aria-label="Фильтр по группам" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 24px">
      <button type="button" class="chip" aria-pressed="{{allOn}}" onClick="{{pickAll}}" style="height: 36px; padding: 0 16px; border: 1px solid {{all.border}}; background: {{all.bg}}; color: {{all.color}}; font-family: inherit; font-size: 14px; font-weight: 500">Все</button>
      <sc-for list="{{chips}}" as="g" hint-placeholder-count="5">
        <button type="button" class="chip" aria-pressed="{{g.on}}" onClick="{{g.toggle}}" style="height: 36px; padding: 0 16px; border: 1px solid {{g.border}}; background: {{g.bg}}; color: {{g.color}}; font-family: inherit; font-size: 14px; font-weight: 500">{{g.name}}</button>
      </sc-for>
      <span aria-hidden="true" style="width: 1px; height: 24px; margin: 0 4px; background: #c4c7e6"></span>
      <button type="button" class="chip" aria-pressed="{{noneOn}}" onClick="{{pickNone}}" style="height: 36px; padding: 0 16px; border: 1px solid {{noneState.border}}; background: {{noneState.bg}}; color: {{noneState.color}}; font-family: inherit; font-size: 14px; font-weight: 500">Без группы</button>
    </div>

    <sc-if value="{{showBlock}}" hint-placeholder-val="{{true}}">
      <section aria-labelledby="keep-in-touch-title" style="background: #ffffff; margin-bottom: 24px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 12px">
          <h2 id="keep-in-touch-title" style="margin: 0; font-size: 13px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: #3c3fc4">Пора связаться</h2>
          <span aria-label="{{countLabel}}" style="min-width: 28px; height: 24px; padding: 0 8px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; background: #dfe1fb; color: #3c3fc4; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums">{{overdueTotal}}</span>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0">
          <sc-for list="{{visible}}" as="p" hint-placeholder-count="5">
            <li style="border-top: 1px solid #e3e5ef; display: flex; align-items: center">
              <a href="Card.dc.html" class="krow" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; padding: 12px 16px 12px 20px; color: #16182b; text-decoration: none">
                <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #4b4fe0; color: #ffffff; font-size: 14px; font-weight: 500">{{p.initials}}</span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                  <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
                  <span style="font-size: 14px; font-weight: 300; color: #5d6077; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.meta}}</span>
                </span>
              </a>
              <button type="button" class="markbtn" onClick="{{p.mark}}" aria-label="{{p.markLabel}}" style="margin-right: 20px; flex-shrink: 0; height: 40px; padding: 0 14px 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #d4d6ef; background: #ffffff; color: #16182b; font-family: inherit; font-size: 14px; font-weight: 500">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3c3fc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                Связался
              </button>
            </li>
          </sc-for>
        </ul>
        <sc-if value="{{hasMore}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{toggle}}" aria-expanded="{{expanded}}" style="width: 100%; height: 48px; border: 0; border-top: 1px solid #e3e5ef; background: #ffffff; color: #3c3fc4; font-family: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px">
            {{toggleLabel}}
            <sc-if value="{{collapsed}}" hint-placeholder-val="{{true}}">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
            </sc-if>
            <sc-if value="{{expanded}}" hint-placeholder-val="{{false}}">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>
            </sc-if>
          </button>
        </sc-if>
      </section>
    </sc-if>

    <div style="position: sticky; top: 0; z-index: 2; margin: 0 -20px; padding: 4px 20px 12px; background: #e7e8f6">
      <div style="position: relative">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3c3fc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 14px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="search" value="{{query}}" onChange="{{onSearch}}" placeholder="Найти по имени" aria-label="Найти контакт по имени" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid transparent; background: #ffffff; padding: 0 12px 0 48px; font-family: inherit; font-size: 16px; color: #16182b; outline: none">
      </div>
      <div style="margin-top: 8px; height: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 14px; color: #5d6077">
        <p style="margin: 0">{{countText}}</p>
        <div role="group" aria-label="Сколько контактов показывать на странице" style="display: flex; align-items: center; gap: 4px">
          <span style="margin-right: 4px">Показывать по</span>
          <button type="button" style="height: 28px; min-width: 32px; padding: 0 6px; border: 0; background: transparent; color: #5d6077; font-family: inherit; font-size: 14px">10</button>
          <button type="button" style="height: 28px; min-width: 32px; padding: 0 6px; border: 0; background: transparent; color: #5d6077; font-family: inherit; font-size: 14px">20</button>
          <button type="button" aria-pressed="true" style="height: 28px; min-width: 32px; padding: 0 6px; border: 0; background: #ffffff; color: #16182b; font-family: inherit; font-size: 14px; font-weight: 500">50</button>
        </div>
      </div>
    </div>

    <sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
      <div style="background: #ffffff; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <p style="margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.02em">{{emptyTitle}}</p>
        <p style="margin: 0; max-width: 440px; font-size: 14px; color: #5d6077">{{emptyText}}</p>
      </div>
    </sc-if>

    <div style="background: #ffffff">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <section aria-label="{{g.ariaLabel}}">
          <sc-if value="{{g.letter}}" hint-placeholder-val="{{true}}">
            <h2 style="margin: 0; padding: 8px 20px; border-top: {{g.topBorder}}; font-size: 13px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: #3c3fc4">{{g.letter}}</h2>
          </sc-if>
          <ul style="list-style: none; margin: 0; padding: 0">
            <sc-for list="{{g.items}}" as="c" hint-placeholder-count="2">
              <li style="position: relative; border-top: 1px solid #e3e5ef">
                <a href="Card.dc.html" class="krow" style="display: flex; align-items: flex-start; gap: 16px; padding: {{c.pad}}; color: #16182b; text-decoration: none">
                  <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #4b4fe0; color: #ffffff; font-size: 14px; font-weight: 500">{{c.initials}}</span>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                    <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
                    <span style="font-size: 14px; font-weight: 300; color: #5d6077; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.details}}</span>
                  </span>
                  <span style="flex-shrink: 0; padding-top: 11px; font-size: 14px; line-height: 1.4; color: #5d6077; font-variant-numeric: tabular-nums">{{c.phone}}</span>
                </a>
                <sc-if value="{{c.hasGroups}}" hint-placeholder-val="{{true}}">
                  <div style="position: absolute; left: 73px; right: 20px; bottom: 8px; height: 30px; display: flex; align-items: center; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent)">
                    <sc-for list="{{c.labels}}" as="l" hint-placeholder-count="2">
                      <button type="button" class="glabel" aria-label="{{l.aria}}" onClick="{{l.add}}" style="flex-shrink: 0; height: 30px; box-sizing: border-box; padding: 0 8px; border: 3px solid transparent; background-color: #dfe1fb; background-clip: padding-box; color: #3c3fc4; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap">{{l.name}}</button>
                    </sc-for>
                  </div>
                </sc-if>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-for>
    </div>
  </main>

  <div role="status" aria-live="polite">
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; right: 24px; bottom: 24px; z-index: 10; min-width: 280px; box-sizing: border-box; padding: 14px 16px; display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #e3e5ef; box-shadow: 0 24px 60px rgba(40, 44, 110, 0.1); font-size: 14px; color: #16182b">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3c3fc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
        {{toastText}}
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startFilter":{"editor":"enum","options":["Все","Друзья + Теннис","Без группы","Семья + Аналитики"],"default":"Все"},"$preview":{"width":1280,"height":1700}}'>
class Component extends DCLogic {
  markContacted(person) {
    const marked = (this.state && this.state.marked) || [];
    clearTimeout(this.toastTimer);
    this.setState({ marked: marked.concat(person.id), toast: 'Отмечено: ' + person.name });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 4000);
  }

  componentWillUnmount() {
    clearTimeout(this.toastTimer);
  }

  renderVals() {
    const GROUPS = ['Аналитики', 'Друзья', 'Знакомые', 'Семья', 'Теннис'];
    const CONTACTS = [
      { id: 'alexandra', name: 'Александра Константиновна Вознесенская-Лисицына', details: 'Юрист · Познакомились на теннисном турнире', phone: '+7 921 000-11-22', groups: ['Аналитики', 'Друзья', 'Знакомые', 'Теннис'] },
      { id: 'alexey', name: 'Алексей Зайцев', details: 'Фотограф · Познакомились на хакатоне в 2019 году', phone: '+7 912 345-67-89', groups: [], od: 3, odMeta: 'раз в квартал · ещё не связывались' },
      { id: 'alina', name: 'Алина Кузьмина', details: 'Юрист · Учились на одном потоке в МГУ', phone: '+7 903 221-14-08', groups: ['Знакомые'] },
      { id: 'anna', name: 'Анна Смирнова', details: 'Дизайнер интерфейсов, бывшая коллега · Работали вместе в студии «Квадрат»', phone: '+7 900 123-45-67', groups: ['Друзья', 'Теннис'], od: 2, odMeta: 'раз в месяц · связались 22 августа' },
      { id: 'boris', name: 'Борис Медведев', details: 'Сосед по даче · Соседи по даче', phone: '+7 916 778-02-11', groups: ['Друзья'] },
      { id: 'vadim', name: 'Вадим Соколов', details: 'Бэкенд-разработчик · Работали вместе в банке', phone: '+7 925 410-33-56', groups: ['Аналитики'] },
      { id: 'vera', name: 'Вера Николаева', details: 'Подруга детства · Учились вместе в школе №57', phone: '', groups: ['Друзья', 'Теннис'] },
      { id: 'viktoria', name: 'Виктория Лебедева', details: 'Психолог · Нас познакомила Лена', phone: '+7 911 502-87-19', groups: [] },
      { id: 'gleb', name: 'Глеб Фёдоров', details: 'Тренер по плаванию · Ходим в один спортзал', phone: '+7 999 120-45-60', groups: ['Теннис'] },
      { id: 'dmitry', name: 'Дмитрий Орлов', details: 'Продуктовый аналитик · Вместе ходили на курсы', phone: '+7 926 300-18-42', groups: ['Аналитики'], od: 4, odMeta: 'раз в неделю · ещё не связывались' },
      { id: 'igor', name: 'Игорь Петров', details: 'Друг семьи · Знакомы с университета', phone: '+7 905 611-20-34', groups: ['Друзья'], od: 5, odMeta: 'раз в неделю · связались 12 октября' },
      { id: 'kirill', name: 'Кирилл Новиков', details: 'Однокурсник · Учились вместе в МГУ', phone: '+7 917 450-71-09', groups: ['Друзья'], od: 7, odMeta: 'раз в месяц · связались 21 сентября' },
      { id: 'maria', name: 'Мария Ковалёва', details: 'Мама · Семья', phone: '+7 903 555-01-02', groups: ['Семья'], od: 6, odMeta: 'раз в квартал · ещё не связывались' },
      { id: 'oleg', name: 'Олег Васильев', details: 'Брат · Семья', phone: '+7 916 222-33-44', groups: ['Семья'], od: 1, odMeta: 'раз в год · связались 3 марта 2025' }
    ];
    const plural = (n) => { const r = new Intl.PluralRules('ru').select(n); return r === 'few' ? 'человека' : 'человек'; };
    const norm = (s) => s.toLocaleLowerCase('ru').replace(/ё/g, 'е');
    const initials = (name) => name.split(' ').slice(0, 2).map((w) => w.charAt(0)).join('');

    const PRESETS = {
      'Все': { sel: [], none: false },
      'Друзья + Теннис': { sel: ['Друзья', 'Теннис'], none: false },
      'Без группы': { sel: [], none: true },
      'Семья + Аналитики': { sel: ['Аналитики', 'Семья'], none: false }
    };
    const s = this.state || {};
    const start = PRESETS[this.props.startFilter] || PRESETS['Все'];
    const sel = s.sel !== undefined ? s.sel : start.sel;
    const none = s.none !== undefined ? s.none : start.none;
    const filtered = none || sel.length > 0;

    const setFilter = (nextSel, nextNone) => this.setState({ sel: nextSel, none: nextNone });
    const withGroup = (g) => GROUPS.filter((x) => x === g || (!none && sel.indexOf(x) !== -1));
    const toggleGroup = (g) => setFilter(!none && sel.indexOf(g) !== -1 ? sel.filter((x) => x !== g) : withGroup(g), false);
    const addGroup = (g) => setFilter(withGroup(g), false);
    const look = (on) => ({ bg: on ? '#4b4fe0' : '#ffffff', color: on ? '#ffffff' : '#16182b', border: on ? '#4b4fe0' : '#d4d6ef' });
    const chips = GROUPS.map((g) => {
      const on = !none && sel.indexOf(g) !== -1;
      return Object.assign({ name: g, on, toggle: () => toggleGroup(g) }, look(on));
    });

    const fits = (c) => (none ? c.groups.length === 0 : sel.every((g) => c.groups.indexOf(g) !== -1));
    const query = s.query || '';
    const words = norm(query).split(/\s+/).filter(Boolean);
    const searching = words.length > 0;
    const matched = CONTACTS.filter((c) => fits(c) && words.every((w) => norm(c.name).includes(w)));
    const toRow = (c) => Object.assign({}, c, {
      initials: initials(c.name),
      hasGroups: c.groups.length > 0,
      pad: c.groups.length > 0 ? '12px 20px 38px' : '12px 20px',
      labels: c.groups.map((n) => ({ name: n, aria: 'Показать группу ' + n, add: () => addGroup(n) }))
    });

    const marked = s.marked || [];
    const overdue = CONTACTS.filter((c) => c.od && fits(c) && marked.indexOf(c.id) === -1)
      .sort((a, b) => a.od - b.od)
      .map((c) => Object.assign({ initials: initials(c.name), meta: c.odMeta, markLabel: 'Связался: ' + c.name, mark: () => this.markContacted(c) }, c));
    const count = overdue.length;
    const expanded = !!s.expanded;

    let groups = [];
    if (searching) {
      groups = matched.length ? [{ letter: '', ariaLabel: 'Найденные контакты', topBorder: '0', items: matched.map(toRow) }] : [];
    } else {
      for (const c of matched) {
        const letter = c.name.charAt(0).toLocaleUpperCase('ru').replace('Ё', 'Е');
        const last = groups[groups.length - 1];
        if (last && last.letter === letter) last.items.push(toRow(c));
        else groups.push({ letter, ariaLabel: 'Буква ' + letter, topBorder: groups.length ? '1px solid #e3e5ef' : '0', items: [toRow(c)] });
      }
    }

    return {
      all: look(!filtered),
      allOn: !filtered,
      pickAll: () => setFilter([], false),
      chips,
      noneState: look(none),
      noneOn: none,
      pickNone: () => setFilter([], !none),
      showBlock: !searching && count > 0,
      overdueTotal: count,
      countLabel: count + ' ' + plural(count),
      visible: expanded ? overdue : overdue.slice(0, 5),
      hasMore: count > 5,
      expanded,
      collapsed: !expanded,
      toggleLabel: expanded ? 'Свернуть' : 'Показать всех (' + count + ')',
      toggle: () => this.setState({ expanded: !expanded }),
      query,
      onSearch: (event) => this.setState({ query: event.target.value }),
      countText: searching || filtered ? 'Найдено: ' + matched.length + ' из ' + CONTACTS.length : CONTACTS.length + ' контактов',
      groups,
      noResults: matched.length === 0,
      emptyTitle: filtered ? 'По выбранным группам никого нет' : 'Никого не нашли по запросу «' + query.trim() + '»',
      emptyText: filtered ? 'Показываем только тех, кто входит во все выбранные группы сразу. Попробуйте снять часть групп.' : 'Поиск идёт по имени. Проверьте написание или попробуйте часть имени.',
      hasToast: !!s.toast,
      toastText: s.toast || ''
    };
  }
}
</script>
</body>
</html>
