<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#3c3fc4}a:hover{color:#4b4fe0}
.krow:focus-visible{outline:2px solid #4b4fe0;outline-offset:-2px}
input::placeholder{color:#5d6077}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1240px; overflow: hidden; background: linear-gradient(180deg, #eceef5 0%, #e4e6f7 18%, #ebe4f5 36%, #e1ebf4 56%, #e8e6f8 76%, #eceef5 100%); color: #16182b; font-family: 'Geologica', system-ui, sans-serif; font-size: 16px; line-height: 1.5">
  <header style="height: 64px; padding: 0 20px; box-sizing: border-box; display: flex; align-items: center">
    <a href="Phone-Main.dc.html" style="display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; line-height: 1; color: #16182b; text-decoration: none"><span aria-hidden="true" style="width: 18px; height: 18px; background: #4b4fe0"></span>Личная CRM</a>
  </header>

  <main style="padding: 16px 20px 64px; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 24px">
      <h1 style="margin: 0; font-size: 36px; line-height: 1.05; letter-spacing: -0.04em; font-weight: 500">Контакты</h1>
      <button type="button" style="position: relative; width: 100%; height: 48px; padding: 0 20px 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #4b4fe0; color: #ffffff; border: 0; font-family: inherit; font-size: 16px; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        Добавить контакт
        <span aria-hidden="true" style="position: absolute; top: -9px; left: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
        <span aria-hidden="true" style="position: absolute; top: -9px; right: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
        <span aria-hidden="true" style="position: absolute; bottom: -9px; left: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
        <span aria-hidden="true" style="position: absolute; bottom: -9px; right: -5px; color: #4b4fe0; font: 300 14px/1 sans-serif">+</span>
      </button>
    </div>

    <sc-if value="{{showBlock}}" hint-placeholder-val="{{true}}">
      <section aria-labelledby="keep-in-touch-title" style="background: #ffffff; margin-bottom: 24px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px">
          <h2 id="keep-in-touch-title" style="margin: 0; font-size: 12px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: #3c3fc4">Пора связаться</h2>
          <span aria-label="{{countLabel}}" style="min-width: 28px; height: 24px; padding: 0 8px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; background: #dfe1fb; color: #3c3fc4; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums">{{overdueTotal}}</span>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0">
          <sc-for list="{{visible}}" as="p" hint-placeholder-count="5">
            <li style="border-top: 1px solid #e3e5ef; display: flex; align-items: center">
              <a href="Phone-Card.dc.html" class="krow" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; color: #16182b; text-decoration: none">
                <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #4b4fe0; color: #ffffff; font-size: 14px; font-weight: 500">{{p.initials}}</span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                  <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
                  <span style="font-size: 14px; font-weight: 300; line-height: 1.4; color: #5d6077">{{p.meta}}</span>
                </span>
              </a>
              <button type="button" onClick="{{p.mark}}" aria-label="{{p.markLabel}}" style="margin-right: 12px; flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #d4d6ef; background: #ffffff; color: #3c3fc4">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
              </button>
            </li>
          </sc-for>
        </ul>
        <sc-if value="{{hasMore}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{toggle}}" aria-expanded="{{expanded}}" style="width: 100%; height: 48px; border: 0; border-top: 1px solid #e3e5ef; background: #ffffff; color: #3c3fc4; font-family: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px">
            {{toggleLabel}}
            <sc-if value="{{collapsed}}" hint-placeholder-val="{{true}}">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
            </sc-if>
            <sc-if value="{{expanded}}" hint-placeholder-val="{{false}}">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>
            </sc-if>
          </button>
        </sc-if>
      </section>
    </sc-if>

    <div style="margin: 0 -20px; padding: 4px 20px 12px">
      <div style="position: relative">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3c3fc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 14px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="search" value="{{query}}" onChange="{{onSearch}}" placeholder="Найти по имени" aria-label="Найти контакт по имени" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid transparent; background: #ffffff; padding: 0 12px 0 48px; font-family: inherit; font-size: 16px; color: #16182b; outline: none">
      </div>
      <div style="margin-top: 8px; height: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: #5d6077">
        <p style="margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{countText}}</p>
        <div role="group" aria-label="Сколько контактов показывать на странице" style="display: flex; flex-shrink: 0; align-items: center; gap: 2px">
          <span style="margin-right: 4px">по</span>
          <button type="button" style="height: 28px; min-width: 32px; padding: 0 6px; border: 0; background: transparent; color: #5d6077; font-family: inherit; font-size: 14px">10</button>
          <button type="button" style="height: 28px; min-width: 32px; padding: 0 6px; border: 0; background: transparent; color: #5d6077; font-family: inherit; font-size: 14px">20</button>
          <button type="button" aria-pressed="true" style="height: 28px; min-width: 32px; padding: 0 6px; border: 0; background: #ffffff; color: #16182b; font-family: inherit; font-size: 14px; font-weight: 500">50</button>
        </div>
      </div>
    </div>

    <sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
      <div style="background: #ffffff; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <p style="margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.02em">{{emptyTitle}}</p>
        <p style="margin: 0; font-size: 14px; color: #5d6077">Поиск идёт по имени. Проверьте написание или попробуйте часть имени.</p>
      </div>
    </sc-if>

    <div style="background: #ffffff">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section aria-label="{{g.ariaLabel}}">
          <sc-if value="{{g.letter}}" hint-placeholder-val="{{true}}">
            <h2 style="margin: 0; padding: 8px 16px; border-top: {{g.topBorder}}; font-size: 12px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: #3c3fc4">{{g.letter}}</h2>
          </sc-if>
          <ul style="list-style: none; margin: 0; padding: 0">
            <sc-for list="{{g.items}}" as="c" hint-placeholder-count="2">
              <li style="border-top: 1px solid #e3e5ef; display: flex; align-items: center">
                <a href="Phone-Card.dc.html" class="krow" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 16px; color: #16182b; text-decoration: none">
                  <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #4b4fe0; color: #ffffff; font-size: 14px; font-weight: 500">{{c.initials}}</span>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                    <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
                    <span style="font-size: 14px; font-weight: 300; color: #5d6077; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.details}}</span>
                  </span>
                </a>
                <button type="button" aria-label="{{c.deleteLabel}}" style="width: 44px; height: 44px; margin-right: 6px; flex-shrink: 0; border: 0; background: transparent; color: #5d6077; display: flex; align-items: center; justify-content: center">
                  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>
                </button>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-for>
    </div>
  </main>

  <div role="status" aria-live="polite">
    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 16px; right: 16px; top: 772px; z-index: 10; box-sizing: border-box; padding: 14px 16px; display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #e3e5ef; box-shadow: 0 24px 60px rgba(40, 44, 110, 0.1); font-size: 14px; color: #16182b">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3c3fc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
        {{toastText}}
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"overdueCount":{"editor":"int","default":7,"min":0,"max":7},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  markContacted(person) {
    const marked = (this.state && this.state.marked) || [];
    clearTimeout(this.toastTimer);
    this.setState({ marked: marked.concat(person.id), toast: 'Отмечено: ' + person.name });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 4000);
  }

  componentWillUnmount() {
    clearTimeout(this.toastTimer);
  }

  renderVals() {
    const OVERDUE = [
      { id: 'oleg', initials: 'ОВ', name: 'Олег Васильев', meta: 'раз в год · связались 3 марта 2025' },
      { id: 'anna', initials: 'АС', name: 'Анна Смирнова', meta: 'раз в месяц · связались 22 августа' },
      { id: 'svetlana', initials: 'СБ', name: 'Светлана Белова', meta: 'раз в квартал · связались 2 июля' },
      { id: 'dmitry', initials: 'ДО', name: 'Дмитрий Орлов', meta: 'раз в неделю · ещё не связывались' },
      { id: 'igor', initials: 'ИП', name: 'Игорь Петров', meta: 'раз в неделю · связались 12 октября' },
      { id: 'maria', initials: 'МК', name: 'Мария Ковалёва', meta: 'раз в квартал · ещё не связывались' },
      { id: 'kirill', initials: 'КН', name: 'Кирилл Новиков', meta: 'раз в месяц · связались 21 сентября' }
    ];
    const CONTACTS = [
      { initials: 'АЗ', name: 'Алексей Зайцев', details: 'Фотограф · Познакомились на хакатоне в 2019 году' },
      { initials: 'АК', name: 'Алина Кузьмина', details: 'Юрист · Учились на одном потоке в МГУ' },
      { initials: 'АС', name: 'Анна Смирнова', details: 'Дизайнер интерфейсов, бывшая коллега · Работали вместе в студии «Квадрат»' },
      { initials: 'БМ', name: 'Борис Медведев', details: 'Сосед по даче · Соседи по даче' },
      { initials: 'ВС', name: 'Вадим Соколов', details: 'Бэкенд-разработчик · Работали вместе в банке' },
      { initials: 'ВН', name: 'Вера Николаева', details: 'Подруга детства · Учились вместе в школе №57' },
      { initials: 'ВЛ', name: 'Виктория Лебедева', details: 'Психолог · Нас познакомила Лена' },
      { initials: 'ГФ', name: 'Глеб Фёдоров', details: 'Тренер по плаванию · Ходим в один спортзал' }
    ].map((c) => Object.assign({ deleteLabel: 'Удалить контакт ' + c.name }, c));
    const plural = (n) => (new Intl.PluralRules('ru').select(n) === 'few' ? 'человека' : 'человек');
    const norm = (s) => s.toLocaleLowerCase('ru').replace(/ё/g, 'е');

    const s = this.state || {};
    const marked = s.marked || [];
    const limit = Math.max(0, Math.min(OVERDUE.length, this.props.overdueCount ?? 7));
    const overdue = OVERDUE.slice(0, limit)
      .filter((p) => marked.indexOf(p.id) === -1)
      .map((p) => Object.assign({}, p, { markLabel: 'Связался: ' + p.name, mark: () => this.markContacted(p) }));
    const count = overdue.length;
    const expanded = !!s.expanded;
    const query = s.query || '';
    const words = norm(query).split(/\s+/).filter(Boolean);
    const searching = words.length > 0;
    const matched = CONTACTS.filter((c) => words.every((w) => norm(c.name).includes(w)));

    let groups = [];
    if (searching) {
      groups = matched.length ? [{ letter: '', ariaLabel: 'Найденные контакты', topBorder: '0', items: matched }] : [];
    } else {
      for (const c of CONTACTS) {
        const letter = c.name.charAt(0).toLocaleUpperCase('ru').replace('Ё', 'Е');
        const last = groups[groups.length - 1];
        if (last && last.letter === letter) last.items.push(c);
        else groups.push({ letter, ariaLabel: 'Буква ' + letter, topBorder: groups.length ? '1px solid #e3e5ef' : '0', items: [c] });
      }
    }

    return {
      showBlock: !searching && count > 0,
      overdueTotal: count,
      countLabel: count + ' ' + plural(count),
      visible: expanded ? overdue : overdue.slice(0, 5),
      hasMore: count > 5,
      expanded,
      collapsed: !expanded,
      toggleLabel: expanded ? 'Свернуть' : 'Показать всех (' + count + ')',
      toggle: () => this.setState({ expanded: !expanded }),
      query,
      onSearch: (event) => this.setState({ query: event.target.value }),
      countText: searching ? 'Найдено: ' + matched.length + ' из 1 000' : '1 000 контактов',
      groups,
      noResults: searching && matched.length === 0,
      emptyTitle: 'Никого не нашли по запросу «' + query.trim() + '»',
      hasToast: !!s.toast,
      toastText: s.toast || ''
    };
  }
}
</script>
</body>
</html>
