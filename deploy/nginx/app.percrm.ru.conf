# app.percrm.ru: the Personal CRM app (docker compose project "prod", port 3000 on localhost).
# Installed by deploy/setup-server.sh. The app has no login: anyone with the address can use it.
server {
    listen 80;
    listen [::]:80;
    server_name app.percrm.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://app.percrm.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.percrm.ru;
    server_tokens off;
    include snippets/percrm-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
