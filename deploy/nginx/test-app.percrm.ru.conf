# Managed by personal-crm staging setup. Do not reuse this file for other sites.
server {
    listen 80;
    listen [::]:80;
    server_name test-app.percrm.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/personal-crm-staging-acme;
    }

    location / {
        return 301 https://test-app.percrm.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-app.percrm.ru;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/test-app.percrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.percrm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Personal CRM staging";
    auth_basic_user_file /etc/nginx/personal-crm-staging.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Basic Auth is handled by nginx, not passed to the application's auth API.
        proxy_set_header Authorization "";
    }
}
