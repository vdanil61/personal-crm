name: Deploy

# Push to main: build the image, push it to GHCR, deploy it to the server.
# Pull requests are checked by ci.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    # One server job at a time; a newer push waits instead of interrupting a deploy halfway
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/server-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # The whole folder, so a new script in deploy/ reaches the server by itself.
      # --no-overwrite-dir keeps the permissions of the server folder; .env there is never touched.
      - name: Copy deploy/ to the server
        run: tar -C deploy --exclude=.env -cf - . | ssh server 'tar -C personal-crm --no-overwrite-dir -xf -'

      - name: Deploy (backup, migrations, new version, smoke /health)
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | ssh server "personal-crm/deploy.sh $IMAGE $REGISTRY_USER"
