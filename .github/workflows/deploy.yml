name: Deploy staging

# Push to main: build the image, push it to GHCR, deploy it to staging only.
# Pull requests are checked by ci.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Deploy staging
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/server-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy staging (migrations, new version, smoke /health)
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/run-deploy.sh staging
